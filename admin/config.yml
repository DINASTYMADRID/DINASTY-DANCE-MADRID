backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Contenido de la web"
    files:
      - name: "site"
        label: "Datos de Dinasty Dance Madrid"
        file: "content/site.json"
        fields:
          - label: "Portada (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Texto pequeño superior", name: "eyebrow", widget: "string" }
              - { label: "Título línea 1", name: "titulo_linea1", widget: "string" }
              - { label: "Título línea 2", name: "titulo_linea2", widget: "string" }
              - { label: "Título línea 3 (color fuego)", name: "titulo_fuego", widget: "string" }
              - { label: "Subtítulo / descripción", name: "subtitulo", widget: "text" }
              - { label: "Año del campeonato", name: "anio", widget: "string" }
              - { label: "Fecha (texto libre)", name: "fecha", widget: "string" }
              - { label: "Sede (texto corto)", name: "sede_corta", widget: "string" }
              - { label: "Logo (usado en menú, portada y pie)", name: "logo_src", widget: "image" }

          - label: "Sobre el campeonato"
            name: "sobre"
            widget: "object"
            fields:
              - { label: "Texto pequeño superior", name: "eyebrow", widget: "string" }
              - { label: "Título línea 1", name: "titulo_linea1", widget: "string" }
              - { label: "Título línea 2", name: "titulo_linea2", widget: "string" }
              - { label: "Párrafo 1 (usa **palabra** para negrita)", name: "parrafo1", widget: "text" }
              - { label: "Párrafo 2", name: "parrafo2", widget: "text" }
              - label: "Estadísticas (3 tarjetas)"
                name: "estadisticas"
                widget: "list"
                fields:
                  - { label: "Número", name: "numero", widget: "string" }
                  - { label: "Etiqueta", name: "etiqueta", widget: "string" }

          - label: "Trayectoria (ediciones)"
            name: "trayectoria"
            widget: "list"
            fields:
              - { label: "Etiqueta (ej. EDICIÓN I)", name: "numero", widget: "string" }
              - { label: "Año", name: "anio", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
              - { label: "Estado (ej. Completada / Próximamente)", name: "etiqueta", widget: "string" }
              - { label: "¿Es la edición destacada/próxima?", name: "destacada", widget: "boolean", default: false }

          - label: "Categorías de baile"
            name: "categorias"
            widget: "list"
            fields:
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }

          - label: "Cómo participar (pasos)"
            name: "participar_pasos"
            widget: "list"
            fields:
              - { label: "Título del paso", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }

          - { label: "Nota bajo los pasos de inscripción", name: "participar_nota", widget: "string" }
          - { label: "Enlace del formulario de inscripción", name: "inscripcion_url", widget: "string" }

          - label: "Entradas"
            name: "entradas"
            widget: "list"
            fields:
              - { label: "Nombre de la entrada", name: "nombre", widget: "string" }
              - { label: "Precio (texto, ej. 15€ o A definir)", name: "precio", widget: "string" }
              - { label: "¿Destacada?", name: "destacada", widget: "boolean", default: false }
              - { label: "Características", name: "caracteristicas", widget: "list" }
              - { label: "Enlace de compra", name: "url", widget: "string" }

          - label: "Sede"
            name: "sede"
            widget: "object"
            fields:
              - { label: "Ciudad", name: "ciudad", widget: "string" }
              - { label: "Recinto", name: "recinto", widget: "string" }
              - { label: "Fecha", name: "fecha", widget: "string" }
              - { label: "Acceso / transporte", name: "acceso", widget: "string" }
              - { label: "Texto descriptivo", name: "texto", widget: "text" }

          - label: "Contacto"
            name: "contacto"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Instagram", name: "instagram", widget: "string" }
              - { label: "TikTok", name: "tiktok", widget: "string" }
              - { label: "YouTube", name: "youtube", widget: "string" }

          - label: "Galería (fotos de ediciones anteriores)"
            name: "galeria"
            widget: "list"
            required: false
            fields:
              - { label: "Imagen", name: "src", widget: "image" }
              - { label: "Descripción (opcional)", name: "caption", widget: "string", required: false }

